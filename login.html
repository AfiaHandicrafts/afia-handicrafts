<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Afia Handicrafts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia', serif; background: #0d0d0d; color: #eae0c8; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .box { background: #111; border: 1px solid #d4af37; padding: 40px; border-radius: 8px; width: 320px; text-align: center; }
  h2 { color: #d4af37; margin-bottom: 25px; }
  input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: #eae0c8; }
  button { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  button:hover { background: #eae0c8; }
  #msg { color: #ff6b6b; margin-top: 15px; font-size: 14px; }
</style>
</head>
<body>

<div class="box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <p id="msg"></p>
</div>

<script>
  const supabaseUrl = 'https://epdjimjsdbgzosblkofl.supabase.co';
  const supabaseKey = 'sb_publishable_h3vwDAv3NUF9af-6FuGJ6Q_oY1g68Eb';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      document.getElementById('msg').innerText = "Login failed: " + error.message;
    } else {
      window.location.href = "admin.html";
    }
  }
</script>

</body>
</html>
